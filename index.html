
<!DOCTYPE html>
<html>
<head>
  <title>VitalMesh</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #000000;
      color: white;
      text-align: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    .wave-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      background: radial-gradient(circle at 20% 30%, rgba(0,255,127,0.10), transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(0,153,255,0.09), transparent 60%),
                  radial-gradient(circle at 50% 90%, rgba(255,23,68,0.07), transparent 60%);
      background-size: 200% 200%;
      animation: drift 18s ease-in-out infinite;
    }
    @keyframes drift {
      0%   { background-position: 0% 0%, 100% 100%, 50% 100%; }
      50%  { background-position: 40% 60%, 60% 30%, 70% 40%; }
      100% { background-position: 0% 0%, 100% 100%, 50% 100%; }
    }

    #patient-id { font-size: 14px; color: #64748b; letter-spacing: 1px; margin-top: 4px; }
    #vitals { font-size: 22px; margin-top: 20px; }
    #status-label { font-size: 20px; font-weight: bold; margin-top: 8px; letter-spacing: 2px; }

    .figure-wrap { position: relative; width: 190px; height: 260px; margin: 30px auto; }

    #aura {
      position: absolute;
      top: 45%; left: 50%;
      width: 260px; height: 260px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      filter: blur(34px);
      opacity: 0.6;
      animation: auraPulse 2s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes auraPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.5; }
      50%      { transform: translate(-50%, -50%) scale(1.15); opacity: 0.85; }
    }

    #figureSvg { position: relative; z-index: 1; width: 100%; height: 100%; }

    .particle {
      transform-box: fill-box;
      transform-origin: center;
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(0) scale(0.6); opacity: 0; }
      12%  { opacity: 1; }
      85%  { opacity: 0.7; }
      100% { transform: translateY(-190px) scale(1); opacity: 0; }
    }

    .silhouette-outline { fill: none; stroke-width: 2; opacity: 0.8; }

    #body-male, #body-female { display: none; }

    .ranges {
      margin: 40px auto 0;
      max-width: 340px;
      font-size: 14px;
      color: #94a3b8;
      border-top: 1px solid #1a1a1a;
      padding-top: 16px;
      line-height: 1.8;
    }
    .ranges b { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wave-bg"></div>

  <h1>VitalMesh</h1>
  <div id="patient-id">Patient: --</div>

  <div class="figure-wrap">
    <div id="aura"></div>

    <svg id="figureSvg" viewBox="0 0 100 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Male silhouette stencil -->
        <clipPath id="clip-male">
          <circle cx="50" cy="22" r="15" />
          <rect x="38" y="40" width="24" height="55" rx="10" />
          <rect x="16" y="44" width="14" height="50" rx="7" />
          <rect x="70" y="44" width="14" height="50" rx="7" />
          <rect x="32" y="95" width="13" height="62" rx="6" />
          <rect x="55" y="95" width="13" height="62" rx="6" />
        </clipPath>

        <!-- Female silhouette stencil -->
        <clipPath id="clip-female">
          <circle cx="50" cy="22" r="15" />
          <rect x="40" y="40" width="20" height="25" rx="8" />
          <rect x="16" y="44" width="14" height="42" rx="7" />
          <rect x="70" y="44" width="14" height="42" rx="7" />
          <polygon points="34,65 66,65 76,105 24,105" />
          <rect x="36" y="105" width="12" height="52" rx="6" />
          <rect x="52" y="105" width="12" height="52" rx="6" />
        </clipPath>
      </defs>

      <!-- MALE figure -->
      <g id="body-male">
        <!-- Faint base fill so the shape reads even without particles -->
        <g clip-path="url(#clip-male)">
          <rect x="0" y="0" width="100" height="190" id="fillMale" fill="#0f2418" />
        </g>
        <!-- Particle field, clipped to the silhouette -->
        <g clip-path="url(#clip-male)" id="particlesMale"></g>
        <!-- Crisp outline on top for definition -->
        <g class="silhouette-outline" id="outlineMale">
          <circle cx="50" cy="22" r="15" />
          <rect x="38" y="40" width="24" height="55" rx="10" />
          <rect x="16" y="44" width="14" height="50" rx="7" />
          <rect x="70" y="44" width="14" height="50" rx="7" />
          <rect x="32" y="95" width="13" height="62" rx="6" />
          <rect x="55" y="95" width="13" height="62" rx="6" />
        </g>
      </g>

      <!-- FEMALE figure -->
      <g id="body-female">
        <g clip-path="url(#clip-female)">
          <rect x="0" y="0" width="100" height="190" id="fillFemale" fill="#0f2418" />
        </g>
        <g clip-path="url(#clip-female)" id="particlesFemale"></g>
        <g class="silhouette-outline" id="outlineFemale">
          <circle cx="50" cy="22" r="15" />
          <rect x="40" y="40" width="20" height="25" rx="8" />
          <rect x="16" y="44" width="14" height="42" rx="7" />
          <rect x="70" y="44" width="14" height="42" rx="7" />
          <polygon points="34,65 66,65 76,105 24,105" />
          <rect x="36" y="105" width="12" height="52" rx="6" />
          <rect x="52" y="105" width="12" height="52" rx="6" />
        </g>
      </g>
    </svg>
  </div>

  <div id="status-label">NORMAL</div>
  <div id="vitals">Waiting for data...</div>

  <div class="ranges">
    <div><b>Normal ranges</b></div>
    <div>Heart rate: 60–100 bpm</div>
    <div>SpO2: 95–100%</div>
    <div>Temperature: 36.1–37.2°C</div>
  </div>

  <script>
    const supabaseUrl = "https://nfrjpccjbjskmvuglhnt.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mcmpwY2NqYmpza212dWdsaG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MTEsImV4cCI6MjEwNDg2NjUxMX0.--QAVv1DIG6GRHo4ayydgfQ31TnWTqBsQwdhqNWxm5M";
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    const stops = [
      { score: 0,   rgb: [0, 255, 127],  label: "NORMAL" },
      { score: 50,  rgb: [0, 153, 255],  label: "CAUTION" },
      { score: 100, rgb: [255, 23, 68],  label: "ABNORMAL" }
    ];

    function blend(a, b, t) { return a.map((c, i) => Math.round(c + t * (b[i] - c))); }

    function scoreToColor(score) {
      score = Math.max(0, Math.min(100, score));
      for (let i = 0; i < stops.length - 1; i++) {
        const a = stops[i], b = stops[i + 1];
        if (score >= a.score && score <= b.score) {
          const t = (score - a.score) / (b.score - a.score);
          const rgb = blend(a.rgb, b.rgb, t);
          const label = t < 0.5 ? a.label : b.label;
          return { css: `rgb(${rgb.join(",")})`, label };
        }
      }
      const last = stops.at(-1);
      return { css: `rgb(${last.rgb.join(",")})`, label: last.label };
    }

    function computeScore(r) {
      const hrDev = Math.abs((r.hr ?? 72) - 72) / 12;
      const spo2Dev = Math.abs((r.spo2 ?? 97) - 97) / 3;
      const tempDev = Math.abs((r.temp ?? 36.8) - 36.8) / 0.6;
      const worstDev = Math.max(hrDev, spo2Dev, tempDev);
      return Math.min(Math.round((worstDev / 3) * 100), 100);
    }

    // Fill each silhouette's particle group with glowing dots, once
    function createParticles(containerId, count = 35) {
      const ns = "http://www.w3.org/2000/svg";
      const group = document.getElementById(containerId);
      group.innerHTML = "";
      for (let i = 0; i < count; i++) {
        const c = document.createElementNS(ns, "circle");
        const x = 15 + Math.random() * 70;
        c.setAttribute("cx", x);
        c.setAttribute("cy", 185);
        c.setAttribute("r", 1.5 + Math.random() * 1.8);
        c.setAttribute("class", "particle");
        c.style.fill = "currentColor";
        c.style.animationDuration = (2 + Math.random() * 2.2) + "s";
        c.style.animationDelay = (Math.random() * 3) + "s";
        group.appendChild(c);
      }
    }

    function setColor(color) {
      document.getElementById("particlesMale").style.color = color;
      document.getElementById("particlesFemale").style.color = color;
      document.getElementById("outlineMale").style.stroke = color;
      document.getElementById("outlineFemale").style.stroke = color;
      document.getElementById("fillMale").setAttribute("fill", color);
      document.getElementById("fillFemale").setAttribute("fill", color);
      document.getElementById("fillMale").style.opacity = 0.12;
      document.getElementById("fillFemale").style.opacity = 0.12;
      document.getElementById("aura").style.background =
        `radial-gradient(circle, ${color} 0%, transparent 70%)`;
    }

    async function loadLatest() {
      const { data } = await client
        .from("readings")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(1);

      if (data && data.length > 0) {
        const r = data[0];
        document.getElementById("patient-id").innerText = "Patient: " + (r.patient_id || "--");
        document.getElementById("vitals").innerText =
          `HR: ${r.hr} bpm | SpO2: ${r.spo2}% | Temp: ${r.temp}°C`;

        const bodyMale = document.getElementById("body-male");
        const bodyFemale = document.getElementById("body-female");
        if (r.gender === "female") {
          bodyFemale.style.display = "inline"; bodyMale.style.display = "none";
        } else {
          bodyMale.style.display = "inline"; bodyFemale.style.display = "none";
        }

        const score = computeScore(r);
        const { css, label } = scoreToColor(score);
        setColor(css);

        const labelEl = document.getElementById("status-label");
        labelEl.innerText = label;
        labelEl.style.color = css;
      }
    }

    createParticles("particlesMale");
    createParticles("particlesFemale");
    loadLatest();
    setInterval(loadLatest, 3000);
  </script>
</body>
</html>
