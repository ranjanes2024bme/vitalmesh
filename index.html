
<!DOCTYPE html>
<html>
<head>
  <title>VitalMesh</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #000000;
      color: white;
      text-align: center;
      padding: 40px 20px;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
    }

    .wave-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      background: radial-gradient(circle at 20% 30%, rgba(0,255,127,0.10), transparent 60%),
                  radial-gradient(circle at 80% 70%, rgba(0,153,255,0.09), transparent 60%),
                  radial-gradient(circle at 50% 90%, rgba(255,23,68,0.07), transparent 60%);
      background-size: 200% 200%;
      animation: drift 18s ease-in-out infinite;
    }
    @keyframes drift {
      0%   { background-position: 0% 0%, 100% 100%, 50% 100%; }
      50%  { background-position: 40% 60%, 60% 30%, 70% 40%; }
      100% { background-position: 0% 0%, 100% 100%, 50% 100%; }
    }

    #patient-id { font-size: 14px; color: #64748b; letter-spacing: 1px; margin-top: 4px; }
    #vitals { font-size: 22px; margin-top: 20px; }
    #status-label { font-size: 20px; font-weight: bold; margin-top: 8px; letter-spacing: 2px; }

    .figure-wrap { position: relative; width: 170px; height: 230px; margin: 30px auto; overflow: visible; }

    #aura {
      position: absolute;
      top: 45%; left: 50%;
      width: 240px; height: 240px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      filter: blur(28px);
      opacity: 0.7;
      animation: auraPulse 2s ease-in-out infinite;
      z-index: 0;
    }
    @keyframes auraPulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1);    opacity: 0.6; }
      50%      { transform: translate(-50%, -50%) scale(1.16); opacity: 0.95; }
    }

    /* Rising spark particles - the "fire travelling upward" effect */
    .spark {
      position: absolute;
      bottom: 20px;
      width: 4px; height: 4px;
      border-radius: 50%;
      opacity: 0;
      animation: riseUp 2.5s ease-in infinite;
    }
    @keyframes riseUp {
      0%   { opacity: 0; transform: translateY(0) scale(0.6); }
      15%  { opacity: 1; }
      80%  { opacity: 0.6; }
      100% { opacity: 0; transform: translateY(-180px) scale(1.2); }
    }

    #dot {
      position: relative;
      z-index: 1;
      width: 120px;
      display: block;
      margin: 45px auto 0;
      animation: pulse 1.6s ease-in-out infinite;
      filter: drop-shadow(0 0 12px rgba(255,255,255,0.4));
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.06); }
    }

    #body-male, #body-female { display: none; }

    .ranges {
      margin: 40px auto 0;
      max-width: 340px;
      font-size: 14px;
      color: #94a3b8;
      border-top: 1px solid #1a1a1a;
      padding-top: 16px;
      line-height: 1.8;
    }
    .ranges b { color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="wave-bg"></div>

  <h1>VitalMesh</h1>
  <div id="patient-id">Patient: --</div>

  <div class="figure-wrap" id="figureWrap">
    <div id="aura"></div>

    <svg id="dot" viewBox="0 0 100 190" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="stickGradient" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" id="gemEdge" stop-color="#166534" />
          <stop offset="45%" id="gemMid" stop-color="#00FF7F" />
          <stop offset="100%" stop-color="#ffffff" />
        </linearGradient>
      </defs>

      <!-- Head -->
      <circle cx="50" cy="22" r="14" fill="none" stroke="url(#stickGradient)" stroke-width="7" stroke-linecap="round" />

      <!-- Bold stick body: male -->
      <g id="body-male" stroke="url(#stickGradient)" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="50" y1="38" x2="50" y2="100" />
        <line x1="50" y1="52" x2="20" y2="78" />
        <line x1="50" y1="52" x2="80" y2="78" />
        <line x1="50" y1="100" x2="26" y2="152" />
        <line x1="50" y1="100" x2="74" y2="152" />
      </g>

      <!-- Bold stick body: female -->
      <g id="body-female" stroke="url(#stickGradient)" stroke-width="7" stroke-linecap="round" fill="none">
        <line x1="50" y1="38" x2="50" y2="80" />
        <line x1="50" y1="52" x2="20" y2="78" />
        <line x1="50" y1="52" x2="80" y2="78" />
        <path d="M36,80 L64,80 L74,116 L26,116 Z" />
        <line x1="40" y1="116" x2="30" y2="152" />
        <line x1="60" y1="116" x2="70" y2="152" />
      </g>
    </svg>
  </div>

  <div id="status-label">NORMAL</div>
  <div id="vitals">Waiting for data...</div>

  <div class="ranges">
    <div><b>Normal ranges</b></div>
    <div>Heart rate: 60–100 bpm</div>
    <div>SpO2: 95–100%</div>
    <div>Temperature: 36.1–37.2°C</div>
  </div>

  <script>
    const supabaseUrl = "https://nfrjpccjbjskmvuglhnt.supabase.co";
    const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5mcmpwY2NqYmpza212dWdsaG50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyOTA1MTEsImV4cCI6MjEwNDg2NjUxMX0.--QAVv1DIG6GRHo4ayydgfQ31TnWTqBsQwdhqNWxm5M";
    const client = supabase.createClient(supabaseUrl, supabaseKey);

    // Bright, vivid neon tones - Green -> Blue -> Red
    const stops = [
      { score: 0,   edge: [0, 100, 50],   mid: [0, 255, 127],  label: "NORMAL" },
      { score: 50,  edge: [0, 60, 140],   mid: [0, 153, 255],  label: "CAUTION" },
      { score: 100, edge: [140, 0, 20],   mid: [255, 23, 68],  label: "ABNORMAL" }
    ];

    function blend(a, b, t) {
      return a.map((c, i) => Math.round(c + t * (b[i] - c)));
    }

    function scoreToColors(score) {
      score = Math.max(0, Math.min(100, score));
      for (let i = 0; i < stops.length - 1; i++) {
        const a = stops[i], b = stops[i + 1];
        if (score >= a.score && score <= b.score) {
          const t = (score - a.score) / (b.score - a.score);
          const edge = blend(a.edge, b.edge, t);
          const mid = blend(a.mid, b.mid, t);
          const label = t < 0.5 ? a.label : b.label;
          return { edgeCss: `rgb(${edge.join(",")})`, midCss: `rgb(${mid.join(",")})`, label };
        }
      }
      const last = stops.at(-1);
      return { edgeCss: `rgb(${last.edge.join(",")})`, midCss: `rgb(${last.mid.join(",")})`, label: last.label };
    }

    function computeScore(r) {
      const hrDev = Math.abs((r.hr ?? 72) - 72) / 12;
      const spo2Dev = Math.abs((r.spo2 ?? 97) - 97) / 3;
      const tempDev = Math.abs((r.temp ?? 36.8) - 36.8) / 0.6;
      const worstDev = Math.max(hrDev, spo2Dev, tempDev);
      return Math.min(Math.round((worstDev / 3) * 100), 100);
    }

    // Rising spark particles, colored to match current status
    function createSparks(color) {
      const wrap = document.getElementById("figureWrap");
      wrap.querySelectorAll(".spark").forEach(el => el.remove());
      for (let i = 0; i < 10; i++) {
        const s = document.createElement("div");
        s.className = "spark";
        s.style.left = (30 + Math.random() * 40) + "%";
        s.style.background = color;
        s.style.boxShadow = `0 0 8px ${color}`;
        s.style.animationDelay = (Math.random() * 2.5) + "s";
        s.style.animationDuration = (1.8 + Math.random() * 1.4) + "s";
        wrap.appendChild(s);
      }
    }

    async function loadLatest() {
      const { data } = await client
        .from("readings")
        .select("*")
        .order("created_at", { ascending: false })
        .limit(1);

      if (data && data.length > 0) {
        const r = data[0];
        document.getElementById("patient-id").innerText = "Patient: " + (r.patient_id || "--");
        document.getElementById("vitals").innerText =
          `HR: ${r.hr} bpm | SpO2: ${r.spo2}% | Temp: ${r.temp}°C`;

        const bodyMale = document.getElementById("body-male");
        const bodyFemale = document.getElementById("body-female");
        if (r.gender === "female") {
          bodyFemale.style.display = "inline"; bodyMale.style.display = "none";
        } else {
          bodyMale.style.display = "inline"; bodyFemale.style.display = "none";
        }

        const score = computeScore(r);
        const { edgeCss, midCss, label } = scoreToColors(score);

        document.getElementById("gemEdge").setAttribute("stop-color", edgeCss);
        document.getElementById("gemMid").setAttribute("stop-color", midCss);
        document.getElementById("aura").style.background =
          `radial-gradient(circle, ${midCss} 0%, ${edgeCss} 55%, transparent 75%)`;

        createSparks(midCss);

        const labelEl = document.getElementById("status-label");
        labelEl.innerText = label;
        labelEl.style.color = midCss;
      }
    }

    loadLatest();
    setInterval(loadLatest, 3000);
  </script>
</body>
</html>
